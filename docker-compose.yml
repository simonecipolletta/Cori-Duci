services:
  db:
    image: postgres:16
    container_name: coriduci_db
    restart: always
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/
  web:
    build: .
    container_name: coriduci_web
    command: sh -c "python manage.py collectstatic --noinput && python manage.py migrate && gunicorn core.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - ./media:/app/media  # Il ponte per le immagini
    ports:
      - "8001:8000"
    env_file:
      - .env
    depends_on:
      - db
volumes:
  postgres_data: