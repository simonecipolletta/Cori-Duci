    <script src="https://www.google.com/recaptcha/api.js?render=6Le0cBwtAAAAANTaNQe2Xjuq_lFwGo7dPV56w90O"></script>
    <script type="text/javascript" src="https://embeds.iubenda.com/widgets/7598b967-597c-4457-bf9f-32b589fe42df.js"></script>
     <!-- Script globale di Iubenda -->
    <script type="text/javascript">
      (function (w,d) {
        var loader = function () {
          var s = d.createElement("script"), tag = d.getElementsByTagName("script")[0]; 
          s.src="https://cdn.iubenda.com/iubenda.js"; 
          tag.parentNode.insertBefore(s,tag);
        }; 
        if(w.addEventListener){
          w.addEventListener("load", loader, false);
        } else if(w.attachEvent){
          w.attachEvent("onload", loader);
        } else {
          w.onload = loader;
        }
      })(window, document);
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
